kind = "web"
previewPath = "/"
title = "App Scontrini Fiscali"
version = "1.0.0"
id = "artifacts/scontrini"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23376

[services.development]
run = "pnpm --filter @workspace/scontrini run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scontrini", "run", "build" ]
serve = "static"
publicDir = "artifacts/scontrini/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23376"
BASE_PATH = "/"
